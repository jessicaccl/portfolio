<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'DM Serif Display';
        src: url('../node_modules/@fontsource/dm-serif-display/files/dm-serif-display-latin-400-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'DM Serif Display';
        font-style: italic;
        src: url('../node_modules/@fontsource/dm-serif-display/files/dm-serif-display-latin-400-italic.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 900;
      }

      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        background: #faf8fd;
        color: #1c2541;
        font-family: 'Inter', sans-serif;
      }

      .text {
        position: absolute;
        left: 80px;
        top: 96px;
        width: 680px;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 0 0 28px;
        font-size: 20px;
        font-weight: 600;
        color: #a8472a;
      }


      h1 {
        margin: 0;
        font-family: 'DM Serif Display', serif;
        font-weight: 400;
        font-size: 76px;
        line-height: 1.06;
        letter-spacing: -0.01em;
      }

      h1 em {
        color: #a8472a;
      }

      .name {
        position: absolute;
        left: 80px;
        bottom: 72px;
        margin: 0;
        display: flex;
        align-items: baseline;
        gap: 6px;
        font-family: 'DM Serif Display', serif;
        font-size: 34px;
      }

      .rule {
        position: absolute;
        left: 80px;
        right: 450px;
        bottom: 128px;
        height: 1px;
        background: #1c2541;
      }

      .portrait {
        position: absolute;
        right: 90px;
        top: 70px;
        width: 300px;
        height: 490px;
      }


      .portrait img {
        position: relative;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
        filter: grayscale(1);
      }

    </style>
  </head>
  <body>
    <div class="text">
      <p class="eyebrow">Produto, qualidade de software e desenvolvimento com IA</p>
      <h1>Product Owner que une negócio, tecnologia e qualidade.</h1>
    </div>
    <div class="rule"></div>
    <p class="name">Jessica Lima</p>
    <div class="portrait"><img src="../public/foto/jessica-lima-960.webp" alt="" /></div>
  </body>
</html>
