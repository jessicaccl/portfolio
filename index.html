<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3ECE2" />
    <script>
      // Aplica o tema antes de pintar a página: escolha salva ou a preferência do sistema.
      try {
        var tema = localStorage.getItem('tema')
        if (tema !== 'claro' && tema !== 'escuro') {
          tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro'
        }
        document.documentElement.dataset.theme = tema === 'escuro' ? 'dark' : 'light'
        if (tema === 'escuro') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#171513')
        }
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <title>Jessica Lima · PO técnica</title>
    <meta
      name="description"
      content="Product Owner que une negócio, tecnologia e qualidade. PO técnica: escrevo os critérios, testo, homologo com quem usa e monitoro depois da entrega."
    />

    <!-- Prévia de compartilhamento (US11). %SITE_URL% é preenchido no build (vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Jessica Lima" />
    <meta property="og:title" content="Jessica Lima · PO técnica" />
    <meta
      property="og:description"
      content="Product Owner que une negócio, tecnologia e qualidade. Escrevo os critérios, testo, homologo com quem usa e monitoro depois da entrega."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jessica Lima, Product Owner que une negócio, tecnologia e qualidade" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
